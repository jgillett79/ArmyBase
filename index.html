<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Base — Phase 0</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="hud">
    <div class="hud-block">
      <span class="hud-label">Cash</span>
      <span id="cashValue">0</span>
    </div>
    <div class="hud-block">
      <span class="hud-label">Roster</span>
      <span id="rosterValue">0 / 5</span>
    </div>
    <div class="hud-block">
      <span class="hud-label">Food</span>
      <span id="foodValue">0</span>
      <button id="buyFoodBtn">Buy 20 ($30)</button>
    </div>
    <div class="hud-block">
      <span class="hud-label">Lumber</span>
      <span id="lumberValue">0</span>
    </div>
    <div class="hud-block">
      <span class="hud-label">Steel</span>
      <span id="steelValue">0</span>
    </div>
    <div class="hud-block">
      <span class="hud-label">Gems</span>
      <span id="gemsValue">0</span>
    </div>
    <div class="hud-block">
      <button id="openMissionsBtn">Missions</button>
    </div>
    <div class="hud-block">
      <button id="buildBarracksBtn">Barracks (<span id="barracksCost">100</span>)</button>
    </div>
    <div class="hud-block">
      <button id="buildRangeBtn">Shooting Range (<span id="rangeCost">80</span>)</button>
    </div>
    <div class="hud-block">
      <button id="buildWeightRoomBtn">Weight Room (<span id="weightRoomCost">80</span>)</button>
    </div>
    <div class="hud-block">
      <button id="buildObstacleCourseBtn">Obstacle Course (<span id="obstacleCourseCost">80</span>)</button>
    </div>
    <div class="hud-block">
      <button id="buildDrillYardBtn">Drill Yard (<span id="drillYardCost">100</span>)</button>
    </div>
    <div class="hud-block">
      <button id="buildMessHallBtn">Mess Hall (120)</button>
    </div>
  </header>

  <main id="gameArea">
    <canvas id="gameCanvas" width="960" height="576"></canvas>
  </main>

  <!-- Unit profile panel -->
  <div id="profilePanel" class="hidden">
    <div class="profile-header">
      <input id="profileName" type="text" maxlength="18">
      <button id="closeProfile">&times;</button>
    </div>
    <div class="profile-body">
      <div class="profile-row"><span>Level</span><span id="profileLevel"></span></div>
      <div class="profile-row">
        <span>XP</span>
        <div class="bar"><div id="profileXpBar" class="bar-fill"></div></div>
      </div>
      <div class="profile-row"><span>Status</span><span id="profileStatus"></span></div>
      <div class="profile-row">
        <span>Energy</span>
        <div class="bar"><div id="profileEnergyBar" class="bar-fill energy"></div></div>
        <span id="profileEnergyText"></span>
      </div>
      <div class="profile-row">
        <span>HP</span>
        <div class="bar"><div id="profileHpBar" class="bar-fill hp"></div></div>
        <span id="profileHpText"></span>
      </div>
      <div class="profile-row"><span>Strength</span><span id="profileStrength"></span></div>
      <div class="profile-row"><span>Accuracy</span><span id="profileAccuracy"></span></div>
      <div class="profile-row"><span>Endurance</span><span id="profileEndurance"></span></div>
      <div class="profile-row"><span>Equipment</span><span id="profileEquipment">None</span></div>
    </div>
    <div class="profile-training">
      <span class="hud-label">Assign to training</span>
      <div class="profile-training-buttons">
        <button id="assignShootingRangeBtn">Shooting Range</button>
        <button id="assignWeightRoomBtn">Weight Room</button>
        <button id="assignObstacleCourseBtn">Obstacle Course</button>
        <button id="assignDrillYardBtn">Drill Yard</button>
      </div>
    </div>
    <div class="profile-actions">
      <button id="recallBtn">Recall to Idle</button>
    </div>
  </div>

  <!-- Recruit confirm popup -->
  <div id="recruitPopup" class="hidden">
    <p id="recruitText"></p>
    <button id="recruitConfirm">Recruit</button>
    <button id="recruitCancel">Ignore</button>
  </div>

  <!-- Missions panel -->
  <div id="missionsPanel" class="hidden">
    <div class="profile-header">
      <span class="hud-label">Missions</span>
      <button id="closeMissions">&times;</button>
    </div>

    <div id="missionTierList" class="mission-tier-list"></div>

    <div id="missionSquadSelect" class="mission-squad-select hidden">
      <span class="hud-label">Squad (<span id="missionSquadCount">0</span>/<span id="missionSquadMax">4</span>)</span>
      <div id="missionUnitList" class="mission-unit-list"></div>
      <div class="mission-preview">
        <span>Success chance</span>
        <span id="missionChancePreview">--</span>
      </div>
      <button id="dispatchMissionBtn" disabled>Dispatch</button>
    </div>

    <div class="mission-active-section">
      <span class="hud-label">Active missions</span>
      <div id="activeMissionsList" class="active-missions-list"></div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/unit.js"></script>
  <script src="js/building.js"></script>
  <script src="js/mission.js"></script>
  <script src="js/state.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
